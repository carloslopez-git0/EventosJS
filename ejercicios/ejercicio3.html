<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3: Multiplicar dos números</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Ejercicio 3: Multiplicar dos números</h1>
        <p>Evento submit del formulario con una función anónima.</p>
    </header>

    <main>
        <form action="" id="formulario">
            <label for="num1">Número 1:</label>
            <input type="number" id="num1" step="any" required>

            <label for="num2">Número 2:</label>
            <input type="number" id="num2" step="any" required>

            <div class="botones">
                <input type="submit" value="Aceptar">
                <input type="reset" value="Cancelar">
            </div>
        </form>
    </main>

    <script src="../js/ejercicio3.js"></script>
</body>
</html>
