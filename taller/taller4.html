<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 4: Formulario de registro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Taller 4: Formulario de registro</h1>
        <p>Desarrolla un programa que valide los datos de registro de un usuario y muestre el primer error que encuentre.</p>
    </header>

    <main>
        <form id="formTaller4" novalidate>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" step="any">

            <label for="edad">Edad:</label>
            <input type="number" id="edad" step="any">

            <label for="correo">Correo:</label>
            <input type="email" id="correo" step="any">

            <label for="clave">Contraseña:</label>
            <input type="password" id="clave" step="any">

            <label for="confirmar">Confirmar contraseña:</label>
            <input type="password" id="confirmar" step="any">

            <div class="botones">
                <input type="submit" value="Verificar">
                <input type="reset" value="Limpiar">
            </div>
        </form>

        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/taller4.js"></script>
</body>
</html>
